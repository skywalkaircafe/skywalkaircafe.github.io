<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e4a3b">
<meta name="robots" content="noindex">
<title>Menu manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --oat: #f3eadb; --paper: #fffaf1; --ink: #2a1e17; --muted: #75665a; --line: #dfd2bd;
    --green: #1e4a3b; --green-d: #16382d; --butter: #f5d06f; --butter-l: #fbeab5;
    --bad: #b23a2a; --veg: #2f8f4e;
    --display: "Caprasimo", Georgia, "Times New Roman", serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--oat); color: var(--ink); font-family: var(--body); line-height: 1.45; }
  body.locked { overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  label { display: block; margin-top: 16px; font-size: .9rem; color: var(--muted); }
  input, textarea {
    display: block; width: 100%; margin-top: 6px; padding: 12px 14px; font: inherit; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px;
  }
  textarea { min-height: 84px; resize: vertical; }
  .primary { width: 100%; padding: 15px 16px; border: 0; border-radius: 14px; background: var(--green); color: var(--oat); font-weight: 700; font-size: 1.02rem; }
  .primary:disabled { opacity: .55; cursor: default; }
  .ghost { padding: 9px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 600; }
  .ghost:disabled { opacity: .55; cursor: default; }
  .danger { width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--bad); background: transparent; color: var(--bad); font-weight: 700; font-size: 1rem; }
  .danger:disabled { opacity: .55; cursor: default; }

  .hero { background: var(--green); color: var(--oat); }
  .awning { height: 14px; background: radial-gradient(circle at 14px 0, var(--green) 13.6px, transparent 14px) 0 0 / 28px 14px repeat-x; }

  /* login */
  .login-hero { padding: 34px 22px 24px; }
  .login-hero > div { max-width: 420px; margin: 0 auto; }
  .login-hero h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 2.2rem; line-height: 1.05; color: var(--butter); }
  .login-hero p { margin: 8px 0 0; }
  #loginForm { max-width: 420px; margin: 0 auto; padding: 8px 22px 40px; }
  #loginErr { min-height: 1.3em; margin: 14px 0 8px; color: var(--bad); font-size: .92rem; }

  /* menu list */
  .bar { padding: 18px 16px 16px; }
  .bar-in { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .bar h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.9rem; line-height: 1.05; color: var(--butter); }
  .bar p { margin: 2px 0 0; font-size: .92rem; opacity: .9; }
  .pill { padding: 9px 15px; border-radius: 999px; border: 1.5px solid var(--oat); background: transparent; color: var(--oat); font-weight: 600; }
  /* section tabs (Orders / Menu) */
  .tabs { max-width: 720px; margin: 14px auto 0; display: flex; gap: 8px; }
  .tabs a { padding: 9px 22px; border-radius: 999px; border: 1.5px solid var(--oat); color: var(--oat); text-decoration: none; font-weight: 600; }
  .tabs a.on { background: var(--butter); border-color: var(--butter); color: var(--green-d); }
  .tabs a:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 8px 16px 90px; }
  .tools { display: flex; gap: 10px; margin-top: 10px; }
  .tools input { margin: 0; flex: 1; min-width: 0; border-radius: 999px; padding: 12px 18px; }
  .add { padding: 0 18px; border: 0; border-radius: 999px; background: var(--green); color: var(--oat); font-weight: 700; white-space: nowrap; }
  .fchips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
  .fchips::-webkit-scrollbar { display: none; }
  .fchip { flex: none; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font-weight: 500; font-size: .9rem; }
  .fchip.on { background: var(--green); border-color: var(--green); color: var(--oat); }
  #msg { min-height: 1.3em; margin: 8px 0 0; color: var(--bad); font-weight: 600; }
  h2.cat { margin: 24px 0 8px; font-family: var(--display); font-weight: 400; font-size: 1.35rem; }
  h2.cat span { margin-left: 8px; font-family: var(--body); font-size: .9rem; color: var(--muted); }
  .empty { padding: 14px 0; color: var(--muted); }

  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 10px; margin-bottom: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
  .main { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0; border: 0; background: transparent; color: var(--ink); text-align: left; }
  .thumb { flex: none; width: 56px; height: 56px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; font-family: var(--display); font-size: 1.4rem; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .nm { display: flex; align-items: center; gap: 7px; font-weight: 600; min-width: 0; }
  .nmt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; }
  .flag { padding: 1px 9px; border-radius: 999px; background: var(--butter-l); color: var(--green-d); font-size: .75rem; font-weight: 700; }
  .row.out .thumb { filter: grayscale(1); opacity: .55; }
  .row.out .nmt { color: var(--muted); }
  .vd { flex: none; width: 16px; height: 16px; border: 1.5px solid var(--veg); border-radius: 3px; display: grid; place-items: center; }
  .vd::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--veg); }
  .vd.nv { border-color: var(--bad); }
  .vd.nv::after { background: var(--bad); }
  .vbtns { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: .88rem; color: var(--muted); }
  .vbtns button { padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--veg); background: transparent; color: var(--veg); font-weight: 700; }
  .vbtns button[data-v="0"] { border-color: var(--bad); color: var(--bad); }

  /* on/off switch */
  .sw { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0; position: relative; font-size: .75rem; color: var(--muted); }
  .sw input { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 44px; height: 26px; margin: 0; padding: 0; border: 0; opacity: 0; cursor: pointer; }
  .sw .track { position: relative; width: 44px; height: 26px; border-radius: 999px; background: var(--line); transition: background .15s; }
  .sw .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked + .track { background: var(--green); }
  .sw input:checked + .track::after { transform: translateX(18px); }
  .sw input:focus-visible + .track { outline: 3px solid var(--green); outline-offset: 2px; }

  /* add / edit sheet */
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--oat); overflow-y: auto; }
  .sheet-in { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-top h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; }
  .photo { aspect-ratio: 4 / 3; width: 100%; border-radius: 16px; overflow: hidden; display: grid; place-items: center; background: var(--paper); border: 1.5px dashed var(--line); color: var(--muted); text-align: center; padding: 8px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-actions { display: flex; gap: 8px; margin-top: 8px; }
  .photo-actions .ghost { flex: 1; }
  .lab { margin: 16px 0 0; font-size: .9rem; color: var(--muted); }
  .seg { display: flex; gap: 8px; margin-top: 6px; }
  .segopt { position: relative; flex: 1; margin: 0; }
  .segopt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; }
  .segopt span { display: block; padding: 12px; text-align: center; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 600; }
  .segopt input:checked + span { color: #fff; border-color: transparent; }
  .segopt.v input:checked + span { background: var(--veg); }
  .segopt.n input:checked + span { background: var(--bad); }
  .segopt input:focus-visible + span { outline: 3px solid var(--green); outline-offset: 2px; }
  .availrow { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--paper); border: 1.5px solid var(--line); }
  .availrow .sw { min-width: 44px; }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: .85rem; }
  #formErr { min-height: 1.3em; margin: 14px 0 8px; color: var(--bad); }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20; max-width: 90vw; text-align: center; padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--oat); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>

<div id="login" hidden>
  <div class="hero login-hero">
    <div>
      <h1>Menu login</h1>
      <p>Skywalk Air Restro &amp; Cafe</p>
    </div>
  </div>
  <div class="awning" aria-hidden="true"></div>
  <form id="loginForm">
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="loginErr" role="alert"></p>
    <button class="primary" id="loginBtn" type="submit">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="hero bar">
    <div class="bar-in">
      <div>
        <h1>Menu manager</h1>
        <p id="count">Skywalk Air Restro &amp; Cafe</p>
      </div>
      <button class="pill" id="signout" type="button">Sign out</button>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="chef.html">Orders</a>
      <a class="on" href="admin.html" aria-current="page">Menu</a>
    </nav>
  </header>
  <div class="awning" aria-hidden="true"></div>
  <div class="wrap">
    <div class="tools">
      <input id="search" type="search" placeholder="Search dishes" aria-label="Search dishes" autocomplete="off">
      <button class="add" id="addBtn" type="button">Add dish</button>
    </div>
    <div class="fchips" id="fchips"></div>
    <p id="msg" role="alert"></p>
    <div id="list"></div>
  </div>
</div>

<div id="sheet" hidden>
  <form class="sheet-in" id="dishForm" novalidate>
    <div class="sheet-top">
      <h1 id="sheetTitle">Add dish</h1>
      <button class="ghost" id="cancelBtn" type="button">Cancel</button>
    </div>

    <div class="photo" id="photoBox">No photo yet</div>
    <div class="photo-actions">
      <button class="ghost" id="chooseBtn" type="button">Choose photo</button>
      <button class="ghost" id="removeBtn" type="button" hidden>Remove photo</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>

    <label>Name
      <input id="name" type="text" maxlength="80" autocomplete="off">
    </label>
    <label>Price in rupees
      <input id="price" type="number" inputmode="numeric" min="0" step="1">
    </label>

    <p class="lab">Veg or non-veg</p>
    <div class="seg" role="radiogroup" aria-label="Veg or non-veg">
      <label class="segopt v"><input type="radio" name="veg" value="veg"><span>Veg</span></label>
      <label class="segopt n"><input type="radio" name="veg" value="nonveg"><span>Non-veg</span></label>
    </div>

    <label>Category
      <input id="category" type="text" maxlength="60" list="cats" autocomplete="off">
    </label>
    <datalist id="cats"></datalist>
    <label>Description
      <textarea id="desc" maxlength="300"></textarea>
    </label>
    <label>Tag (optional)
      <input id="tag" type="text" maxlength="24" placeholder="e.g. Bestseller" autocomplete="off">
    </label>

    <div class="availrow">
      <span>Available today</span>
      <label class="sw"><input type="checkbox" id="avail" aria-label="Available today"><span class="track"></span></label>
    </div>

    <label>Position on menu
      <input id="pos" type="number" inputmode="numeric" min="1" step="1" placeholder="Leave empty for the end">
    </label>
    <p class="hint">Dishes with a smaller number show first.</p>

    <p id="formErr" role="alert"></p>
    <button class="primary" id="saveBtn" type="submit">Add dish</button>
    <button class="danger" id="deleteBtn" type="button" hidden>Delete dish</button>
  </form>
</div>

<div id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAe_YNUjcL-ANqTH1YJ_u5EJ7mGZu-xQdw",
    authDomain: "skyewalk-web.firebaseapp.com",
    projectId: "skyewalk-web",
    storageBucket: "skyewalk-web.firebasestorage.app",
    messagingSenderId: "963472175218",
    appId: "1:963472175218:web:7e27ae19ba16147ff652eb"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const NO_ORDER = 9999;

  /* ---------- login ---------- */
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginErr").textContent = "";
    $("loginBtn").disabled = true;
    try {
      await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
    } catch (err) {
      console.error(err);
      $("loginErr").textContent = err.code === "auth/network-request-failed"
        ? "No internet connection."
        : "Wrong email or password.";
    }
    $("loginBtn").disabled = false;
  });
  $("signout").addEventListener("click", () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      $("login").hidden = true;
      $("app").hidden = false;
      startListening();
    } else {
      stopListening();
      closeSheet();
      $("app").hidden = true;
      $("login").hidden = false;
      $("password").value = "";
    }
  });

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(text) {
    $("toast").textContent = text;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, 2500);
  }
  const failText = err => err && err.code === "permission-denied"
    ? "You are signed out. Sign in again and retry."
    : "Could not save. Check your internet and try again.";

  /* ---------- menu list ---------- */
  let items = [];
  let unsub = null;
  let lastCategory = "";
  let filter = "all";

  const preds = { all: () => true, nophoto: i => !i.image, noveg: i => i.veg === null, soldout: i => !i.available };
  const FLABEL = { all: "All", nophoto: "No photo", noveg: "Veg not set", soldout: "Sold out" };
  const tints = [["#efe1b8", "#7a5b12"], ["#d9e3d3", "#2f5a44"], ["#f0d5c8", "#8a4330"], ["#e6dac6", "#5b4636"]];
  function tintFor(name) {
    let h = 0;
    for (const ch of String(name)) h = (h + ch.charCodeAt(0)) % tints.length;
    return tints[h];
  }

  function startListening() {
    stopListening();
    unsub = db.collection("menu").onSnapshot(snap => {
      $("msg").textContent = "";
      items = snap.docs.map(d => {
        const x = d.data();
        return {
          id: d.id,
          name: x.name || "",
          price: x.price,
          category: (x.category || "").trim(),
          description: x.description || "",
          image: x.image || "",
          order: Number.isFinite(x.order) ? x.order : NO_ORDER,
          veg: typeof x.veg === "boolean" ? x.veg : null,
          available: x.available !== false,
          tag: x.tag || ""
        };
      }).sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
      render();
    }, err => {
      console.error(err);
      $("msg").textContent = "Could not load the menu: " + err.message;
    });
  }
  function stopListening() { if (unsub) { unsub(); unsub = null; } }

  function rowHtml(i) {
    const [bg, fg] = tintFor(i.name);
    const thumb = i.image
      ? `<img src="${esc(i.image)}" alt="">`
      : esc((i.name.trim()[0] || "?").toUpperCase());
    const vd = i.veg === null ? ""
      : `<span class="vd ${i.veg ? "" : "nv"}" role="img" aria-label="${i.veg ? "Vegetarian" : "Non-vegetarian"}"></span>`;
    const flags = (i.image ? "" : `<span class="flag">No photo</span>`) + (i.tag ? `<span class="flag">${esc(i.tag)}</span>` : "");
    const vbtns = i.veg === null
      ? `<div class="vbtns"><span>Veg or non-veg?</span>
          <button type="button" data-setveg="${esc(i.id)}" data-v="1">Veg</button>
          <button type="button" data-setveg="${esc(i.id)}" data-v="0">Non-veg</button></div>` : "";
    return `<div class="row${i.available ? "" : " out"}">
      <button class="main" type="button" data-edit="${esc(i.id)}">
        <span class="thumb" style="background:${bg};color:${fg}">${thumb}</span>
        <span class="info">
          <span class="nm">${vd}<span class="nmt">${esc(i.name)}</span></span>
          <span class="meta">&#8377;${esc(i.price)}${flags}</span>
        </span>
      </button>
      <label class="sw">
        <input type="checkbox" data-avail="${esc(i.id)}" ${i.available ? "checked" : ""} aria-label="Available: ${esc(i.name)}">
        <span class="track"></span>
        <span>${i.available ? "Available" : "Sold out"}</span>
      </label>
      ${vbtns}
    </div>`;
  }

  function render() {
    const counts = {};
    Object.keys(preds).forEach(k => { counts[k] = items.filter(preds[k]).length; });
    if (filter !== "all" && !counts[filter]) filter = "all";
    $("fchips").innerHTML = Object.keys(preds)
      .filter(k => k === "all" || counts[k] > 0)
      .map(k => `<button type="button" class="fchip${k === filter ? " on" : ""}" data-f="${k}">${FLABEL[k]} ${counts[k]}</button>`).join("");
    $("cats").innerHTML = [...new Set(items.map(i => i.category).filter(Boolean))]
      .map(c => `<option value="${esc(c)}"></option>`).join("");
    $("count").textContent = items.length
      ? items.length + (items.length === 1 ? " dish" : " dishes") + " on the menu"
      : "Skywalk Air Restro & Cafe";

    const list = $("list");
    if (!items.length) {
      list.innerHTML = `<p class="empty">No dishes yet. Tap Add dish to create the first one.</p>`;
      return;
    }
    const q = $("search").value.trim().toLowerCase();
    const shown = items.filter(i => preds[filter](i) &&
      (!q || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q)));
    if (!shown.length) {
      list.innerHTML = `<p class="empty">No dish matches.</p>`;
      return;
    }
    const groups = new Map();
    shown.forEach(i => {
      const c = i.category || "Other";
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(i);
    });
    const cats = [...groups.entries()].sort((a, b) =>
      Math.min(...a[1].map(x => x.order)) - Math.min(...b[1].map(x => x.order)));
    list.innerHTML = cats.map(([c, arr]) =>
      `<h2 class="cat">${esc(c)}<span>${arr.length}</span></h2>${arr.map(rowHtml).join("")}`).join("");
  }

  $("search").addEventListener("input", render);
  $("fchips").addEventListener("click", e => {
    const b = e.target.closest("[data-f]");
    if (b) { filter = b.dataset.f; render(); }
  });
  $("addBtn").addEventListener("click", () => openSheet(null));

  $("list").addEventListener("click", async e => {
    const edit = e.target.closest("[data-edit]");
    if (edit) { openSheet(edit.dataset.edit); return; }
    const sv = e.target.closest("[data-setveg]");
    if (sv) {
      sv.disabled = true;
      try {
        await db.collection("menu").doc(sv.dataset.setveg).update({ veg: sv.dataset.v === "1" });
        toast(sv.dataset.v === "1" ? "Marked veg" : "Marked non-veg");
      } catch (err) {
        console.error(err);
        toast(failText(err));
        sv.disabled = false;
      }
    }
  });
  $("list").addEventListener("change", async e => {
    const cb = e.target.closest("[data-avail]");
    if (!cb) return;
    const on = cb.checked;
    try {
      await db.collection("menu").doc(cb.dataset.avail).update({ available: on });
      toast(on ? "Dish is available" : "Dish marked sold out");
    } catch (err) {
      console.error(err);
      cb.checked = !on;
      toast(failText(err));
    }
  });

  /* ---------- add / edit sheet ---------- */
  let editingId = null;
  let photo = "";

  function setPhoto(src) {
    photo = src;
    $("photoBox").innerHTML = src ? `<img src="${esc(src)}" alt="Dish photo">` : "No photo yet";
    $("removeBtn").hidden = !src;
    $("chooseBtn").textContent = src ? "Change photo" : "Choose photo";
  }
  function nextOrder() {
    const used = items.map(i => i.order).filter(o => o !== NO_ORDER);
    return used.length ? Math.max(...used) + 1 : 1;
  }
  function slugFor(name) {
    const base = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "dish";
    const taken = new Set(items.map(i => i.id));
    let id = base, n = 2;
    while (taken.has(id)) id = base + "-" + n++;
    return id;
  }
  const vegChoice = () => { const r = document.querySelector('input[name="veg"]:checked'); return r ? r.value : null; };

  function openSheet(id) {
    const it = id ? items.find(x => x.id === id) : null;
    if (id && !it) return;
    editingId = it ? it.id : null;
    $("sheetTitle").textContent = it ? "Edit dish" : "Add dish";
    $("name").value = it ? it.name : "";
    $("price").value = it && it.price != null ? it.price : "";
    $("category").value = it ? it.category : lastCategory;
    $("desc").value = it ? it.description : "";
    $("tag").value = it ? it.tag : "";
    $("avail").checked = it ? it.available : true;
    $("pos").value = it && it.order !== NO_ORDER ? it.order : "";
    document.querySelectorAll('input[name="veg"]').forEach(r => {
      r.checked = !!it && it.veg !== null && r.value === (it.veg ? "veg" : "nonveg");
    });
    setPhoto(it ? it.image : "");
    $("saveBtn").textContent = it ? "Save dish" : "Add dish";
    $("deleteBtn").hidden = !it;
    $("formErr").textContent = "";
    $("sheet").hidden = false;
    $("sheet").scrollTop = 0;
    document.body.classList.add("locked");
    if (!it) $("name").focus();
  }
  function closeSheet() {
    $("sheet").hidden = true;
    document.body.classList.remove("locked");
  }
  $("cancelBtn").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  /* ---------- photo: shrink before saving so the menu stays fast ---------- */
  function shrink(file, maxSide) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = 0.72, out = c.toDataURL("image/jpeg", q);
        while (out.length > 140000 && q > 0.4) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
        resolve(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
      img.src = url;
    });
  }
  $("chooseBtn").addEventListener("click", () => $("file").click());
  $("removeBtn").addEventListener("click", () => setPhoto(""));
  $("file").addEventListener("change", async e => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const before = photo;
    $("formErr").textContent = "";
    $("photoBox").textContent = "Preparing photo...";
    try {
      setPhoto(await shrink(f, 520));
    } catch (err) {
      console.error(err);
      setPhoto(before);
      $("formErr").textContent = "This photo could not be read. Choose a JPG or PNG photo.";
    }
  });

  /* ---------- save / delete ---------- */
  $("dishForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("name").value.trim();
    const category = $("category").value.trim();
    const price = Math.round(parseFloat($("price").value));
    if (!name || !category || !Number.isFinite(price) || price < 0) {
      $("formErr").textContent = "Enter a name, a price and a category.";
      return;
    }
    const existing = editingId ? items.find(x => x.id === editingId) : null;
    const veg = vegChoice();
    if (!veg && !(existing && existing.veg === null)) {
      $("formErr").textContent = "Choose veg or non-veg.";
      return;
    }
    let order = parseInt($("pos").value, 10);
    if (!Number.isFinite(order)) order = existing && existing.order !== NO_ORDER ? existing.order : nextOrder();

    const data = {
      name, price, category,
      description: $("desc").value.trim(),
      image: photo,
      order,
      available: $("avail").checked,
      tag: $("tag").value.trim()
    };
    if (veg) data.veg = veg === "veg";

    $("formErr").textContent = "";
    $("saveBtn").disabled = true;
    const label = $("saveBtn").textContent;
    $("saveBtn").textContent = "Saving...";
    try {
      if (existing) await db.collection("menu").doc(existing.id).update(data);
      else await db.collection("menu").doc(slugFor(name)).set(data);
      lastCategory = category;
      toast(existing ? "Dish saved" : "Dish added");
      closeSheet();
    } catch (err) {
      console.error(err);
      $("formErr").textContent = failText(err);
    }
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = label;
  });

  $("deleteBtn").addEventListener("click", async () => {
    const it = items.find(x => x.id === editingId);
    if (!it) return;
    if (!confirm("Delete " + it.name + "? This cannot be undone.")) return;
    $("deleteBtn").disabled = true;
    try {
      await db.collection("menu").doc(it.id).delete();
      toast("Dish deleted");
      closeSheet();
    } catch (err) {
      console.error(err);
      $("formErr").textContent = "Could not delete. Check your internet and try again.";
    }
    $("deleteBtn").disabled = false;
  });
</script>
</body>
</html>
