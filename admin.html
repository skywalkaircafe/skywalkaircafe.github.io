<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Menu manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #201f1d; --panel: #2b2a27; --line: #3d3b37; --text: #f1ece3;
    --muted: #a8a196; --amber: #e9a63b; --ok: #7cc48a; --bad: #e77a6b;
    --head: "Bricolage Grotesque", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  body.locked { overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  label { display: block; margin-top: 14px; font-size: .9rem; color: var(--muted); }
  input, textarea { display: block; width: 100%; margin-top: 6px; padding: 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  textarea { min-height: 84px; resize: vertical; }
  .primary { width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--amber); color: #1b1a18; font-weight: 700; font-size: 1rem; }
  .primary:disabled { opacity: .55; cursor: default; }
  .ghost { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); color: var(--text); }
  .ghost:disabled { opacity: .55; cursor: default; }
  .danger { width: 100%; margin-top: 12px; padding: 13px; border-radius: 10px; border: 1.5px solid var(--bad); background: transparent; color: var(--bad); font-weight: 700; font-size: 1rem; }
  .danger:disabled { opacity: .55; cursor: default; }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .login-card h1 { font-family: var(--head); font-size: 1.5rem; margin: 0 0 4px; }
  .login-card p { margin: 0 0 16px; color: var(--muted); }
  #loginErr { min-height: 1.3em; margin: 12px 0 8px !important; color: var(--bad) !important; font-size: .92rem; }

  /* menu list */
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 90px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .title { font-family: var(--head); font-size: 1.5rem; margin: 0; }
  .title small { font-family: system-ui, sans-serif; font-weight: 400; font-size: .9rem; color: var(--muted); margin-left: 6px; }
  .tools { display: flex; gap: 10px; margin: 14px 0 4px; }
  .tools input { margin: 0; flex: 1; min-width: 0; }
  .add { padding: 0 16px; border: 0; border-radius: 10px; background: var(--amber); color: #1b1a18; font-weight: 700; white-space: nowrap; }
  #msg { color: var(--bad); min-height: 1.3em; margin: 8px 0 0; }
  h2.cat { font-family: var(--head); font-size: 1.1rem; margin: 24px 0 8px; color: var(--amber); }
  h2.cat span { color: var(--muted); font-weight: 400; font-size: .95rem; }
  .empty { color: var(--muted); padding: 12px 0; }
  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; margin-bottom: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text); text-align: left; }
  .thumb { flex: none; width: 56px; height: 56px; border-radius: 10px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--head); font-size: 1.4rem; color: var(--muted); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .info b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: .9rem; }
  .nophoto { color: var(--amber); margin-left: 10px; }
  .chev { color: var(--muted); font-size: 1.4rem; }

  /* add / edit sheet */
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto; }
  .sheet-in { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-top h1 { font-family: var(--head); font-size: 1.4rem; margin: 0; }
  .photo { aspect-ratio: 4 / 3; width: 100%; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); text-align: center; padding: 8px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-actions { display: flex; gap: 8px; margin-top: 8px; }
  .photo-actions .ghost { flex: 1; padding: 11px 12px; }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: .85rem; }
  #formErr { color: var(--bad); min-height: 1.3em; margin: 14px 0 8px; }

  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20; background: var(--text); color: #1b1a18; padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: 90vw; }
</style>
</head>
<body>

<div id="login" hidden>
  <form class="login-card" id="loginForm">
    <h1>Menu login</h1>
    <p>Sign in to add and edit dishes.</p>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="loginErr" role="alert"></p>
    <button class="primary" id="loginBtn" type="submit">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="top">
      <h1 class="title">Menu<small id="count"></small></h1>
      <button class="ghost" id="signout" type="button">Sign out</button>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search dishes" aria-label="Search dishes">
      <button class="add" id="addBtn" type="button">Add dish</button>
    </div>
    <p id="msg" role="alert"></p>
    <div id="list"></div>
  </div>
</div>

<div id="sheet" hidden>
  <form class="sheet-in" id="dishForm" novalidate>
    <div class="sheet-top">
      <h1 id="sheetTitle">Add dish</h1>
      <button class="ghost" id="cancelBtn" type="button">Cancel</button>
    </div>

    <div class="photo" id="photoBox">No photo yet</div>
    <div class="photo-actions">
      <button class="ghost" id="chooseBtn" type="button">Choose photo</button>
      <button class="ghost" id="removeBtn" type="button" hidden>Remove photo</button>
    </div>
    <input id="file" type="file" accept="image/*" hidden>

    <label>Name
      <input id="name" type="text" maxlength="80" autocomplete="off">
    </label>
    <label>Price in rupees
      <input id="price" type="number" inputmode="numeric" min="0" step="1">
    </label>
    <label>Category
      <input id="category" type="text" maxlength="60" list="cats" autocomplete="off">
    </label>
    <datalist id="cats"></datalist>
    <label>Description
      <textarea id="desc" maxlength="300"></textarea>
    </label>
    <label>Position on menu
      <input id="pos" type="number" inputmode="numeric" min="1" step="1" placeholder="Leave empty for the end">
    </label>
    <p class="hint">Dishes with a smaller number show first.</p>

    <p id="formErr" role="alert"></p>
    <button class="primary" id="saveBtn" type="submit">Add dish</button>
    <button class="danger" id="deleteBtn" type="button" hidden>Delete dish</button>
  </form>
</div>

<div id="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAe_YNUjcL-ANqTH1YJ_u5EJ7mGZu-xQdw",
    authDomain: "skyewalk-web.firebaseapp.com",
    projectId: "skyewalk-web",
    storageBucket: "skyewalk-web.firebasestorage.app",
    messagingSenderId: "963472175218",
    appId: "1:963472175218:web:7e27ae19ba16147ff652eb"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const NO_ORDER = 9999;

  /* ---------- login ---------- */
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginErr").textContent = "";
    $("loginBtn").disabled = true;
    try {
      await auth.signInWithEmailAndPassword($("email").value.trim(), $("password").value);
    } catch (err) {
      console.error(err);
      $("loginErr").textContent = err.code === "auth/network-request-failed"
        ? "No internet connection."
        : "Wrong email or password.";
    }
    $("loginBtn").disabled = false;
  });
  $("signout").addEventListener("click", () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      $("login").hidden = true;
      $("app").hidden = false;
      startListening();
    } else {
      stopListening();
      closeSheet();
      $("app").hidden = true;
      $("login").hidden = false;
      $("password").value = "";
    }
  });

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(text) {
    $("toast").textContent = text;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").hidden = true; }, 2500);
  }

  /* ---------- menu list ---------- */
  let items = [];
  let unsub = null;
  let lastCategory = "";

  function startListening() {
    stopListening();
    unsub = db.collection("menu").onSnapshot(snap => {
      $("msg").textContent = "";
      items = snap.docs.map(d => {
        const x = d.data();
        return {
          id: d.id,
          name: x.name || "",
          price: x.price,
          category: (x.category || "").trim(),
          description: x.description || "",
          image: x.image || "",
          order: Number.isFinite(x.order) ? x.order : NO_ORDER
        };
      }).sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
      render();
    }, err => {
      console.error(err);
      $("msg").textContent = "Could not load the menu: " + err.message;
    });
  }
  function stopListening() { if (unsub) { unsub(); unsub = null; } }

  function rowHtml(i) {
    const thumb = i.image
      ? `<img src="${esc(i.image)}" alt="">`
      : esc((i.name.trim()[0] || "?").toUpperCase());
    return `<button class="row" type="button" data-edit="${esc(i.id)}">
      <span class="thumb">${thumb}</span>
      <span class="info">
        <b>${esc(i.name)}</b>
        <span class="meta">&#8377;${esc(i.price)}${i.image ? "" : '<span class="nophoto">No photo</span>'}</span>
      </span>
      <span class="chev" aria-hidden="true">&rsaquo;</span>
    </button>`;
  }

  function render() {
    $("count").textContent = items.length ? items.length + (items.length === 1 ? " dish" : " dishes") : "";
    $("cats").innerHTML = [...new Set(items.map(i => i.category).filter(Boolean))]
      .map(c => `<option value="${esc(c)}"></option>`).join("");

    const list = $("list");
    if (!items.length) {
      list.innerHTML = `<p class="empty">No dishes yet. Tap Add dish to create the first one.</p>`;
      return;
    }
    const q = $("search").value.trim().toLowerCase();
    const shown = items.filter(i => !q || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
    if (!shown.length) {
      list.innerHTML = `<p class="empty">No dish matches &ldquo;${esc(q)}&rdquo;.</p>`;
      return;
    }
    const groups = new Map();
    shown.forEach(i => {
      const c = i.category || "Other";
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(i);
    });
    const cats = [...groups.entries()].sort((a, b) =>
      Math.min(...a[1].map(x => x.order)) - Math.min(...b[1].map(x => x.order)));
    list.innerHTML = cats.map(([c, arr]) =>
      `<h2 class="cat">${esc(c)} <span>${arr.length}</span></h2>${arr.map(rowHtml).join("")}`).join("");
  }

  $("search").addEventListener("input", render);
  $("list").addEventListener("click", e => {
    const b = e.target.closest("[data-edit]");
    if (b) openSheet(b.dataset.edit);
  });
  $("addBtn").addEventListener("click", () => openSheet(null));

  /* ---------- add / edit sheet ---------- */
  let editingId = null;
  let photo = "";

  function setPhoto(src) {
    photo = src;
    $("photoBox").innerHTML = src ? `<img src="${esc(src)}" alt="Dish photo">` : "No photo yet";
    $("removeBtn").hidden = !src;
    $("chooseBtn").textContent = src ? "Change photo" : "Choose photo";
  }

  function nextOrder() {
    const used = items.map(i => i.order).filter(o => o !== NO_ORDER);
    return used.length ? Math.max(...used) + 1 : 1;
  }

  function slugFor(name) {
    const base = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "dish";
    const taken = new Set(items.map(i => i.id));
    let id = base, n = 2;
    while (taken.has(id)) id = base + "-" + n++;
    return id;
  }

  function openSheet(id) {
    const it = id ? items.find(x => x.id === id) : null;
    if (id && !it) return;
    editingId = it ? it.id : null;
    $("sheetTitle").textContent = it ? "Edit dish" : "Add dish";
    $("name").value = it ? it.name : "";
    $("price").value = it && it.price != null ? it.price : "";
    $("category").value = it ? it.category : lastCategory;
    $("desc").value = it ? it.description : "";
    $("pos").value = it && it.order !== NO_ORDER ? it.order : "";
    setPhoto(it ? it.image : "");
    $("saveBtn").textContent = it ? "Save dish" : "Add dish";
    $("deleteBtn").hidden = !it;
    $("formErr").textContent = "";
    $("sheet").hidden = false;
    $("sheet").scrollTop = 0;
    document.body.classList.add("locked");
    if (!it) $("name").focus();
  }
  function closeSheet() {
    $("sheet").hidden = true;
    document.body.classList.remove("locked");
  }
  $("cancelBtn").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

  /* ---------- photo: shrink before saving so the menu stays fast ---------- */
  function shrink(file, maxSide) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale));
        const h = Math.max(1, Math.round(img.naturalHeight * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = 0.72, out = c.toDataURL("image/jpeg", q);
        while (out.length > 140000 && q > 0.4) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
        resolve(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
      img.src = url;
    });
  }

  $("chooseBtn").addEventListener("click", () => $("file").click());
  $("removeBtn").addEventListener("click", () => setPhoto(""));
  $("file").addEventListener("change", async e => {
    const f = e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const before = photo;
    $("formErr").textContent = "";
    $("photoBox").textContent = "Preparing photo...";
    try {
      setPhoto(await shrink(f, 520));
    } catch (err) {
      console.error(err);
      setPhoto(before);
      $("formErr").textContent = "This photo could not be read. Choose a JPG or PNG photo.";
    }
  });

  /* ---------- save / delete ---------- */
  $("dishForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("name").value.trim();
    const category = $("category").value.trim();
    const price = Math.round(parseFloat($("price").value));
    if (!name || !category || !Number.isFinite(price) || price < 0) {
      $("formErr").textContent = "Enter a name, a price and a category.";
      return;
    }
    const existing = editingId ? items.find(x => x.id === editingId) : null;
    let order = parseInt($("pos").value, 10);
    if (!Number.isFinite(order)) order = existing && existing.order !== NO_ORDER ? existing.order : nextOrder();

    const data = { name, price, category, description: $("desc").value.trim(), image: photo, order };
    $("formErr").textContent = "";
    $("saveBtn").disabled = true;
    const label = $("saveBtn").textContent;
    $("saveBtn").textContent = "Saving...";
    try {
      if (existing) {
        await db.collection("menu").doc(existing.id).update(data);
      } else {
        await db.collection("menu").doc(slugFor(name)).set(data);
      }
      lastCategory = category;
      toast(existing ? "Dish saved" : "Dish added");
      closeSheet();
    } catch (err) {
      console.error(err);
      $("formErr").textContent = err.code === "permission-denied"
        ? "You are signed out. Sign in again and retry."
        : "Could not save. Check your internet and try again.";
    }
    $("saveBtn").disabled = false;
    $("saveBtn").textContent = label;
  });

  $("deleteBtn").addEventListener("click", async () => {
    const it = items.find(x => x.id === editingId);
    if (!it) return;
    if (!confirm("Delete " + it.name + "? This cannot be undone.")) return;
    $("deleteBtn").disabled = true;
    try {
      await db.collection("menu").doc(it.id).delete();
      toast("Dish deleted");
      closeSheet();
    } catch (err) {
      console.error(err);
      $("formErr").textContent = "Could not delete. Check your internet and try again.";
    }
    $("deleteBtn").disabled = false;
  });
</script>
</body>
</html>
